[tool.poetry]
name = "mcp-chatbot"
version = "0.1.0"
description = "Customer support chatbot using MCP"
authors = ["Norbert"]
packages = [{ include = "src", from = "." }]  

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.109.2"
uvicorn = "^0.23.2"
streamlit = "^1.29.0"
httpx = "^0.26.0"
python-dotenv = "^1.0.1"
langchain = "^0.3.25"
langchain-groq = "^0.3.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
